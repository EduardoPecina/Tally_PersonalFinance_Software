# Configuración del portal local de TALLY. Sin lógica de negocio aquí.

[server]
address = "localhost"   # solo accesible desde esta PC
port = 8765             # puerto fijo, distinto del 8501 por defecto
headless = true
runOnSave = false

[browser]
gatherUsageStats = false   # sin telemetría
serverAddress = "localhost"
serverPort = 8765

[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#6B53F1"            # acento de la marca
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F4F6"
textColor = "#101014"               # tinta de la marca
font = "sans serif"
